name: Release

# Runs on every push of a "v*" tag (e.g. v1.0.0) and builds on both
# platforms (the Mac build has to be built on Mac, the Windows build on
# Windows — no cross-compiling).
#
# Two-phase, not electron-builder --publish: each platform's `build` job
# only builds locally (electron-builder --publish never) and uploads its
# installer files as a plain workflow artifact; a single `publish` job,
# which needs both builds, then creates ONE GitHub Release and attaches
# both platforms' assets to it in one atomic `gh release create` call.
#
# This replaces an earlier attempt that let each platform's job run
# `electron-builder --publish always` directly. That created a SEPARATE
# draft release per job even with the matrix forced sequential
# (max-parallel: 1) — electron-builder's GitHub publish provider doesn't
# reuse an existing DRAFT release from an earlier job/run, so the second
# job always created its own duplicate rather than finding the first job's
# release. Found for real on the actual v1.0.0 release attempt, twice (see
# LESSONS.md) — a single job that owns the one release call sidesteps the
# whole class of problem instead of trying to coordinate multiple
# electron-builder publish invocations.
#
# Code signing/notarization is deliberately optional (see CLAUDE.md):
# without the secrets below, electron-builder automatically builds
# unsigned (users see Gatekeeper/SmartScreen warnings); once certificates
# exist, setting the secrets in the repo (Settings → Secrets and variables
# → Actions) is enough — this file doesn't need to change for that.
on:
  push:
    tags:
      - 'v*'

# Needed for the publish job's `gh release create` — the repo's default
# GITHUB_TOKEN permission is read-only (Settings -> Actions -> General ->
# Workflow permissions).
permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: npm ci

      - name: Build (installer only, no publish — the publish job handles that)
        run: npx electron-builder --${{ matrix.os == 'macos-latest' && 'mac' || 'win' }} --publish never
        env:
          # Prevents electron-builder from looking for a local keychain
          # identity on CI runners (never present there anyway) —
          # regardless of whether signing via CSC_LINK happens below.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          # Mac: code signing (.p12 certificate, base64-encoded) + notarization
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Windows: code-signing certificate (.pfx, base64-encoded)
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}

      # Only the actual release-worthy files — not the unpacked app
      # directories (dist/mac-arm64/, dist/win-unpacked/), which are large
      # and not something anyone downloads directly.
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.os }}
          path: |
            dist/*.dmg
            dist/*.exe
            dist/*.blockmap
            dist/*.yml
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Create GitHub Release (draft) with both platforms' assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${{ github.ref_name }}" dist/* --repo "${{ github.repository }}" --title "${{ github.ref_name }}" --draft --generate-notes
