name: CI

# Runs on every push to dev or main. No pull_request trigger needed: GitHub
# matches required status checks by commit SHA, not by the event that
# produced the check — the push-triggered `test` run on dev already covers
# the later dev→main PR on that same commit, so a duplicate pull_request
# trigger would just re-test it for nothing.
on:
  push:
    branches: [dev, main]

# Superseded runs on the same branch are pointless once a newer commit exists,
# and they actively hurt: three runs once started within the same second (a dev
# push, a main push and a tag), putting five runners on one account in
# parallel. The slowest test job ever recorded happened in exactly that
# situation, and it is the one that flaked. Cancelling stale runs keeps
# contention — and with it timing-sensitive failures — down.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # The suite runs in well under 2 minutes; anything approaching this limit
    # is hung, not slow. Without it a stuck Electron/CDP session would burn
    # GitHub's 6-hour default before being killed, and `build` (needs: test)
    # would wait behind it the whole time.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test

  # Unsigned dev builds as a downloadable workflow artifact — separate from
  # release.yml (tag-triggered, signed, publishes to GitHub Releases). Dev
  # only, not main: a main push is normally immediately followed by a `v*`
  # tag push, which triggers release.yml's own build of the same commit —
  # running this job there too would just be a redundant, unsigned rebuild
  # of what release.yml is about to build anyway.
  build:
    needs: test
    if: github.ref == 'refs/heads/dev'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            build_cmd: npm run build:mac
          - os: windows-latest
            build_cmd: npm run build:win
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # electron-builder implicitly tries to publish to GitHub Releases
      # whenever it detects a CI environment, even without --publish being
      # passed (a behavior it's deprecating in v27, but still defaults to
      # here) — this job has no GH_TOKEN (deliberately: it only produces a
      # downloadable workflow artifact, publishing is release.yml's job on
      # a tag push), so that implicit publish attempt fails the build.
      # --publish never turns it off explicitly.
      - run: ${{ matrix.build_cmd }} -- --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: pageboard-${{ matrix.os }}
          path: dist/
          retention-days: 14
